<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fc4c02">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>Stride – Habit Tracker</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--text:#1d1d1f;--muted:#76767c;--line:#e4e4e0;--accent:#fc4c02;--accent-soft:#fff0e9;--empty:#e9e9e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1f1f23;--text:#f2f2f3;--muted:#9a9aa2;--line:#2e2e33;--accent-soft:#33190e;--empty:#2b2b30;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141416;--card:#1f1f23;--text:#f2f2f3;--muted:#9a9aa2;--line:#2e2e33;--accent-soft:#33190e;--empty:#2b2b30;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Barlow","Helvetica Neue",Arial,sans-serif;font-size:16px;overflow:hidden}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header{padding:18px 20px 8px}
header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px;font-style:italic}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
main{flex:1;overflow-y:auto;padding:8px 16px 24px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h2{margin:0 0 12px;font-size:16px;font-weight:700}
.row{display:flex;align-items:center;gap:12px}
.hab{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hab:last-child{border-bottom:0}
.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;flex:none}
.hab .t{flex:1;min-width:0}
.hab .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hab .t span{font-size:13px;color:var(--muted)}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;color:#fff;font-size:20px;cursor:pointer;flex:none;transition:transform .15s,background .15s}
.chk.on{border-color:transparent;transform:scale(1.06)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:26px;font-weight:800;font-style:italic;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.hero{background:var(--accent);color:#fff;border-radius:14px;padding:18px;margin-bottom:12px;display:flex;align-items:center;gap:16px}
.hero b{font-size:36px;font-weight:800;font-style:italic;line-height:1;display:block}
.hero span{font-size:14px;opacity:.92}
.bar{height:8px;border-radius:4px;background:var(--empty);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;padding:10px 0 12px;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;cursor:pointer}
nav button .i{display:block;font-size:22px;line-height:1.2}
nav button.on{color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;width:100%}
.btn.sec{background:var(--empty);color:var(--text)}
.btn.del{background:transparent;color:#d92d20}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:20px 20px 28px;max-height:90%;overflow-y:auto}
.sheet h3{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
input[type=range]{width:100%;accent-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{width:42px;height:42px;border-radius:50%;border:2px solid transparent;background:var(--empty);font-size:20px;cursor:pointer;display:grid;place-items:center}
.opt.sel{border-color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.fab{position:absolute;right:18px;bottom:84px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:30px;box-shadow:0 4px 14px rgba(252,76,2,.4);cursor:pointer;z-index:2}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title"></h1><p id="sub"></p></header>
  <main id="main"></main>
  <button class="fab" id="fab" aria-label="Add habit">+</button>
  <nav>
    <button data-v="today"><span class="i">✔</span>Today</button>
    <button data-v="stats"><span class="i">📈</span>Progress</button>
    <button data-v="habits"><span class="i">⚙</span>Habits</button>
  </nav>
</div>
<script>
const COLORS=['#fc4c02','#1e88e5','#2e9e5b','#8e44ad','#e0a100','#d6336c'];
const EMOJI=['🏃','💧','📖','🧘','💪','😴','🥗','✍️','🎸','🚴','🧹','💊'];
const DAYS=['M','T','W','T','F','S','S'];
let S={habits:[],logs:{}},view='today';
const $=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const done=(id,date)=>(S.logs[date]||[]).includes(id);
async function api(path,opt){const r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'}},opt));if(!r.ok)throw new Error(r.status);return r.status===204?null:r.json()}
async function load(){try{S.habits=await api('/api/habits');S.logs=await api('/api/logs?days=130')}catch(e){$('#main').innerHTML='<div class="empty">Can’t reach the server. Check your connection and reload.</div>';return false}return true}
function streak(id){let d=new Date(),n=0;if(!done(id,iso(d)))d=addDays(d,-1);
  while(done(id,iso(d))){n++;d=addDays(d,-1)}return n}
function bestStreak(id){let b=0,c=0;for(let i=120;i>=0;i--){if(done(id,iso(addDays(new Date(),-i)))){c++;b=Math.max(b,c)}else c=0}return b}
function weekCount(id){const m=monday(new Date());let n=0;for(let i=0;i<7;i++)if(done(id,iso(addDays(m,i))))n++;return n}
function toggle(id){const d=iso(new Date());const a=S.logs[d]||(S.logs[d]=[]);const i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);render();
  api('/api/habits/'+id+'/toggle',{method:'POST',body:JSON.stringify({date:d})}).catch(()=>{const j=a.indexOf(id);j<0?a.push(id):a.splice(j,1);render()})}

function ring(p,c,size){const r=size/2-6,L=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="8"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="${L*p} ${L}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}

function vToday(){
  const H=S.habits,t=iso(new Date()),n=H.filter(h=>done(h.id,t)).length;
  if(!H.length)return `<div class="empty">No habits yet. Tap + to create your first one.</div>`;
  return `<div class="hero">${ring(n/H.length,'',84)}<div><b>${n}/${H.length}</b><span>habits done today</span></div></div>
  <div class="card"><h2>Today’s habits</h2>${H.map(h=>`<div class="hab"><div class="ico" style="background:${h.color}22">${h.emoji}</div>
  <div class="t"><b>${esc(h.name)}</b><span>🔥 ${streak(h.id)}-day streak · ${weekCount(h.id)}/${h.goal} this week</span></div>
  <button class="chk ${done(h.id,t)?'on':''}" style="${done(h.id,t)?'background:'+h.color:''}" data-t="${h.id}" aria-label="Mark ${esc(h.name)}">${done(h.id,t)?'✓':''}</button></div>`).join('')}</div>`}

function vStats(){
  const H=S.habits;if(!H.length)return `<div class="empty">Add a habit to see your progress.</div>`;
  const m=monday(new Date()),today=new Date();
  // last 7 days bars
  const bars=[];for(let i=6;i>=0;i--){const d=addDays(today,-i);const c=H.filter(h=>done(h.id,iso(d))).length;bars.push({l:DAYS[(d.getDay()+6)%7],p:c/H.length,c})}
  const W=300,Hh=120,bw=28,gap=(W-bw*7)/6;
  const svg=`<svg viewBox="0 0 ${W} ${Hh+20}" width="100%" role="img" aria-label="Completion over the last 7 days">${bars.map((b,i)=>{const h=Math.max(4,b.p*Hh),x=i*(bw+gap);
    return `<rect x="${x}" y="${Hh-h}" width="${bw}" height="${h}" rx="6" fill="${b.p>0?'var(--accent)':'var(--empty)'}"/><text x="${x+bw/2}" y="${Hh+15}" text-anchor="middle" font-size="11" fill="var(--muted)">${b.l}</text>`}).join('')}</svg>`;
  // heatmap 12 weeks
  const start=addDays(m,-77);let cells='';
  for(let w=0;w<12;w++)for(let d=0;d<7;d++){const dt=addDays(start,w*7+d);if(dt>today){continue}
    const p=H.filter(h=>done(h.id,iso(dt))).length/H.length;
    const op=p===0?0:.25+p*.75;cells+=`<rect x="${w*22}" y="${d*22}" width="18" height="18" rx="4" fill="${p?'var(--accent)':'var(--empty)'}" ${p?`fill-opacity="${op}"`:''}><title>${iso(dt)}</title></rect>`}
  // totals
  let tot=0,poss=0;for(let i=0;i<30;i++){const d=iso(addDays(today,-i));tot+=H.filter(h=>done(h.id,d)).length;poss+=H.length}
  const best=Math.max(...H.map(h=>bestStreak(h.id))),wk=H.reduce((a,h)=>a+weekCount(h.id),0);
  return `<div class="stats"><div class="stat"><b>${wk}</b><span>check-ins this week</span></div><div class="stat"><b>${Math.round(tot/poss*100)}%</b><span>30-day consistency</span></div><div class="stat"><b>${best}</b><span>best streak (days)</span></div></div>
  <div class="card"><h2>Last 7 days</h2>${svg}</div>
  <div class="card"><h2>Weekly goals</h2>${H.map(h=>{const c=weekCount(h.id),p=Math.min(1,c/h.goal);return `<div style="margin-bottom:14px"><div class="row"><span>${h.emoji}</span><b style="flex:1">${esc(h.name)}</b><span style="color:var(--muted);font-size:13px">${c}/${h.goal} days</span></div><div class="bar"><i style="width:${p*100}%;background:${h.color}"></i></div></div>`}).join('')}</div>
  <div class="card"><h2>Last 12 weeks</h2><div style="overflow-x:auto"><svg viewBox="0 0 262 152" width="100%" role="img" aria-label="Activity heatmap">${cells}</svg></div>
  <div class="legend"><span>Less</span><span>More</span></div></div>`}

function vHabits(){
  if(!S.habits.length)return `<div class="empty">Nothing here yet. Tap + to add a habit.</div>`;
  return `<div class="card"><h2>Your habits</h2>${S.habits.map(h=>`<div class="hab"><div class="ico" style="background:${h.color}22">${h.emoji}</div><div class="t"><b>${esc(h.name)}</b><span>Goal: ${h.goal} days a week</span></div><button class="btn sec" style="width:auto;padding:8px 14px" data-e="${h.id}">Edit</button></div>`).join('')}</div>`}

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function sheet(id){
  const h=S.habits.find(x=>x.id===id)||{name:'',emoji:EMOJI[0],color:COLORS[0],goal:5};
  let em=h.emoji,co=h.color;
  const bg=document.createElement('div');bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="Habit form"><h3>${id?'Edit habit':'New habit'}</h3>
  <label for="nm">Name</label><input type="text" id="nm" maxlength="40" value="${esc(h.name)}" placeholder="e.g. Meditate 10 minutes">
  <label>Icon</label><div class="opts" id="em">${EMOJI.map(e=>`<button class="opt ${e===em?'sel':''}" data-v="${e}">${e}</button>`).join('')}</div>
  <label>Colour</label><div class="opts" id="co">${COLORS.map(c=>`<button class="opt ${c===co?'sel':''}" data-v="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div>
  <label for="gl">Weekly goal: <b id="gv">${h.goal}</b> days</label><input type="range" id="gl" min="1" max="7" value="${h.goal}">
  <div style="display:grid;gap:8px;margin-top:20px"><button class="btn" id="sv">Save habit</button><button class="btn sec" id="cn">Cancel</button>${id?'<button class="btn del" id="dl">Delete habit</button>':''}</div></div>`;
  $('#app').appendChild(bg);
  const pick=(box,set)=>bg.querySelector(box).addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;set(b.dataset.v);bg.querySelectorAll(box+' .opt').forEach(x=>x.classList.toggle('sel',x===b))});
  pick('#em',v=>em=v);pick('#co',v=>co=v);
  bg.querySelector('#gl').oninput=e=>bg.querySelector('#gv').textContent=e.target.value;
  bg.querySelector('#cn').onclick=()=>bg.remove();
  bg.querySelector('#sv').onclick=async()=>{const name=bg.querySelector('#nm').value.trim();if(!name){bg.querySelector('#nm').focus();return}
    const goal=+bg.querySelector('#gl').value;
    const body=JSON.stringify({name,emoji:em,color:co,goal});
    try{if(id){const u=await api('/api/habits/'+id,{method:'PUT',body});Object.assign(S.habits.find(x=>x.id===id),u)}
    else S.habits.push(await api('/api/habits',{method:'POST',body}))}catch(e){alert('Could not save the habit. Try again.');return}
    bg.remove();render()};
  const dl=bg.querySelector('#dl');if(dl)dl.onclick=async()=>{if(confirm('Delete this habit and its history?')){try{await api('/api/habits/'+id,{method:'DELETE'})}catch(e){alert('Could not delete. Try again.');return}S.habits=S.habits.filter(x=>x.id!==id);bg.remove();render()}};
}

function render(){
  const T={today:['Today',new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})],stats:['Progress','Your consistency at a glance'],habits:['Habits','Customise what you track']};
  $('#title').textContent=T[view][0];$('#sub').textContent=T[view][1];
  $('#main').innerHTML={today:vToday,stats:vStats,habits:vHabits}[view]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#fab').style.display=view==='stats'?'none':'block';
}
$('#main').addEventListener('click',e=>{const t=e.target.closest('[data-t]'),x=e.target.closest('[data-e]');if(t)toggle(t.dataset.t);if(x)sheet(x.dataset.e)});
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;render();$('#main').scrollTop=0}});
$('#fab').onclick=()=>sheet();
load().then(ok=>{if(ok)render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
