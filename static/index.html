<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fc4c02">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<title>Stride – Habit Tracker</title>
<style>
/* ── TOKENS ──────────────────────────────────────────── */
:root{
  --bg:#f5f5f3;--surface:#fff;--surface2:#f0f0ee;--border:#e8e8e4;
  --text:#1a1a1c;--text2:#6b6b72;
  --accent:#fc4c02;--accent-soft:#fff0e9;--accent-dark:#d93c00;
  --sh-sm:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --sh:0 4px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --sh-lg:0 12px 40px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.06);
  --r:14px;--r-lg:22px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:68px;
  --ease:cubic-bezier(.4,0,.2,1);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f11;--surface:#1c1c1f;--surface2:#252528;--border:#2e2e33;
    --text:#f0f0f2;--text2:#8e8e96;--accent-soft:#2d1409;
    --sh-sm:0 1px 3px rgba(0,0,0,.35);
    --sh:0 4px 16px rgba(0,0,0,.35);
    --sh-lg:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0f11;--surface:#1c1c1f;--surface2:#252528;--border:#2e2e33;
  --text:#f0f0f2;--text2:#8e8e96;--accent-soft:#2d1409;
  --sh-sm:0 1px 3px rgba(0,0,0,.35);
  --sh:0 4px 16px rgba(0,0,0,.35);
  --sh-lg:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ── RESET ───────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;min-height:-webkit-fill-available;overflow:hidden}
body{background:var(--bg);color:var(--text);
  font-family:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}

/* ── SHELL ───────────────────────────────────────────── */
#app{max-width:430px;margin:0 auto;height:100%;height:100dvh;min-height:-webkit-fill-available;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ── HEADER ──────────────────────────────────────────── */
header{
  padding:calc(var(--safe-t) + 14px) 20px 10px;
  display:flex;align-items:flex-start;justify-content:space-between;
  flex-shrink:0;gap:12px;
}
.hd-text h1{font-size:26px;font-weight:800;font-style:italic;letter-spacing:-.5px;line-height:1.1}
.hd-text p{font-size:13px;color:var(--text2);margin-top:3px;font-weight:500}
.hd-actions{display:flex;gap:8px;padding-top:4px}
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:var(--surface2);color:var(--text);font-size:17px;
  display:grid;place-items:center;cursor:pointer;
  transition:.2s var(--ease);box-shadow:var(--sh-sm);
}
.icon-btn:active{transform:scale(.9)}

/* ── MAIN ────────────────────────────────────────────── */
main{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:4px 16px calc(var(--nav-h) + var(--safe-b) + 76px);
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
main::-webkit-scrollbar{display:none}

/* ── CARDS ───────────────────────────────────────────── */
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--sh-sm);margin-bottom:12px;overflow:hidden}
.card-p{padding:16px}
.card-title{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text2);margin-bottom:14px}

/* ── HERO ────────────────────────────────────────────── */
.hero{
  background:linear-gradient(140deg,var(--accent) 0%,#ff6b35 100%);
  border-radius:var(--r-lg);padding:22px 20px;margin-bottom:14px;
  position:relative;overflow:hidden;
  box-shadow:0 8px 32px rgba(252,76,2,.35);
}
.hero::before{
  content:'';position:absolute;top:-50px;right:-50px;
  width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);
}
.hero::after{
  content:'';position:absolute;bottom:-30px;right:50px;
  width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.05);
}
.hero-inner{display:flex;align-items:center;gap:18px;position:relative;z-index:1}
.hero-txt .big{font-size:42px;font-weight:800;font-style:italic;line-height:1;color:#fff;display:block}
.hero-txt .big sub{font-size:22px;opacity:.7;font-style:normal}
.hero-txt .lbl{font-size:14px;color:rgba(255,255,255,.88);margin-top:4px;display:block;font-weight:600}
.hero-txt .msg{font-size:12px;color:rgba(255,255,255,.7);margin-top:6px;display:block;font-weight:500}
.ring-svg{flex-shrink:0}
.ring-bg{fill:none;stroke:rgba(255,255,255,.2)}
.ring-fg{fill:none;stroke:#fff;stroke-linecap:round;transform-origin:center;transform:rotate(-90deg);transition:stroke-dasharray .7s var(--ease)}

/* ── HABIT ROWS ──────────────────────────────────────── */
.hab-row{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--border);position:relative;
  transition:background .15s;
}
.hab-row:last-child{border-bottom:none}
.hab-row:active{background:var(--surface2)}
.hab-accent{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0}
.hab-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.hab-info{flex:1;min-width:0}
.hab-name{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.hab-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.streak-pill{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--text2)}
.wk-dots{display:flex;gap:3px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.done{background:var(--accent)}
.dot.miss{background:var(--border)}
.dot.future{background:transparent;border:1.5px solid var(--border)}
.wk-txt{font-size:11px;font-weight:600}

/* Check button */
.chk{
  width:44px;height:44px;border-radius:50%;border:2.5px solid var(--border);
  background:transparent;cursor:pointer;flex-shrink:0;
  display:grid;place-items:center;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s;
  position:relative;overflow:hidden;
}
.chk-mark{font-size:19px;color:#fff;opacity:0;transform:scale(.3);
  transition:opacity .2s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.chk.on{border-color:transparent;transform:scale(1.08)}
.chk.on .chk-mark{opacity:1;transform:scale(1)}
/* ripple */
.chk::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--accent);transform:scale(0);opacity:.15;transition:transform .4s,opacity .4s}
.chk:active::after{transform:scale(1.5);opacity:0;transition:0s}

/* ── STAT GRID ───────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 10px;text-align:center;box-shadow:var(--sh-sm)}
.stat-num{display:block;font-size:28px;font-weight:800;font-style:italic;color:var(--accent);line-height:1}
.stat-lbl{display:block;font-size:11px;color:var(--text2);margin-top:4px;font-weight:600;line-height:1.3}

/* Bar chart */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:96px;padding:0 2px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end}
.bar-fill{width:100%;min-height:4px;border-radius:5px 5px 0 0;background:var(--border);transition:height .5s var(--ease)}
.bar-fill.hi{background:var(--accent)}
.bar-day{font-size:10px;font-weight:700;color:var(--text2)}
.bar-day.cur{color:var(--accent)}

/* Heatmap */
.hmap-wrap{overflow-x:auto;padding-bottom:2px}
.hmap-wrap::-webkit-scrollbar{height:3px}
.hmap-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.hmap-legend{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text2);margin-top:8px;font-weight:500}
.hmap-swatches{display:flex;gap:3px;align-items:center}
.hmap-swatches span{width:11px;height:11px;border-radius:3px}

/* Habit progress bars */
.hp-list{display:flex;flex-direction:column;gap:14px}
.hp-row{}
.hp-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.hp-ico{font-size:15px}
.hp-name{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp-cnt{font-size:12px;color:var(--text2);font-weight:700;flex-shrink:0}
.hp-bar{height:7px;background:var(--surface2);border-radius:10px;overflow:hidden}
.hp-fill{height:100%;border-radius:10px;transition:width .6s var(--ease)}
.hp-sub{font-size:11px;color:var(--text2);margin-top:5px;font-weight:500}

/* ── HABITS MANAGE ───────────────────────────────────── */
.mg-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.mg-row:last-child{border-bottom:none}
.mg-info{flex:1;min-width:0}
.mg-name{font-size:15px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-goal{font-size:12px;color:var(--text2);margin-top:2px;display:block;font-weight:500}
.edit-btn{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--text);font:inherit;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;transition:.2s var(--ease)}
.edit-btn:active{background:var(--surface2)}

/* ── NAV ─────────────────────────────────────────────── */
nav{
  display:flex;border-top:1px solid var(--border);background:var(--surface);
  padding-bottom:var(--safe-b);flex-shrink:0;position:relative;
  box-shadow:0 -4px 20px rgba(0,0,0,.06);
}
.nav-pill{
  position:absolute;top:8px;
  height:calc(100% - 16px - var(--safe-b));
  background:var(--accent-soft);border-radius:10px;
  transition:left .25s var(--ease),width .25s var(--ease);
  pointer-events:none;
}
nav button{
  flex:1;padding:9px 0 11px;border:0;background:none;color:var(--text2);
  font:inherit;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  position:relative;z-index:1;transition:color .2s;
}
nav button .ni{font-size:20px;line-height:1}
nav button.on{color:var(--accent)}

/* ── FAB ─────────────────────────────────────────────── */
.fab{
  position:absolute;right:16px;
  bottom:calc(var(--nav-h) + var(--safe-b) + 10px);
  width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;
  font-size:30px;font-weight:300;line-height:1;
  display:grid;place-items:center;cursor:pointer;z-index:10;
  box-shadow:0 6px 24px rgba(252,76,2,.45);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;
}
.fab:active{transform:scale(.88)}
.fab.open{transform:rotate(45deg)}

/* ── SHEET ───────────────────────────────────────────── */
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,0);z-index:20;display:flex;align-items:flex-end;transition:background .3s}
.sh-bg.vis{background:rgba(0,0,0,.55)}
.sh{
  background:var(--surface);width:100%;
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:0 20px calc(var(--safe-b) + 24px);
  max-height:92%;overflow-y:auto;
  transform:translateY(100%);transition:transform .35s var(--ease);
  box-shadow:var(--sh-lg);
}
.sh-bg.vis .sh{transform:translateY(0)}
.sh::-webkit-scrollbar{display:none}
.sh-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 20px}
.sh h3{font-size:20px;font-weight:800;color:var(--text);margin-bottom:20px}
.fl{margin-bottom:18px}
.fl-lbl{display:block;font-size:11px;font-weight:800;color:var(--text2);letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
.fl-inp{
  width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--surface2);color:var(--text);font:inherit;font-size:16px;font-weight:500;outline:none;
  transition:border-color .2s;
}
.fl-inp:focus{border-color:var(--accent)}
.pick-grid{display:flex;flex-wrap:wrap;gap:8px}
.pick-opt{
  width:44px;height:44px;border-radius:12px;border:2px solid transparent;
  background:var(--surface2);font-size:21px;cursor:pointer;
  display:grid;place-items:center;transition:.2s var(--ease);
}
.pick-opt.on{border-color:var(--text);transform:scale(1.1)}
.col-opt{
  width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;
  transition:.2s var(--ease);position:relative;
}
.col-opt.on::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800}
.goal-big{text-align:center;font-size:40px;font-weight:800;font-style:italic;color:var(--accent);line-height:1;padding:6px 0}
.goal-sub{text-align:center;font-size:12px;color:var(--text2);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);margin:12px 0}
.btn-col{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.btn{padding:15px;border-radius:12px;border:none;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:.15s var(--ease)}
.btn-p{background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(252,76,2,.3)}
.btn-p:active{transform:scale(.97)}
.btn-s{background:var(--surface2);color:var(--text)}
.btn-d{background:transparent;color:#ef4444}

/* ── EMPTY ───────────────────────────────────────────── */
.empty{text-align:center;padding:52px 24px;color:var(--text2)}
.empty .ei{font-size:56px;margin-bottom:16px}
.empty h3{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px}
.empty p{font-size:14px;line-height:1.6}

/* ── SKELETON ────────────────────────────────────────── */
@keyframes shimmer{from{background-position:-600px 0}to{background-position:600px 0}}
.skel{
  background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);
  background-size:1200px 100%;animation:shimmer 1.6s infinite;border-radius:8px;
}

/* ── TOAST ───────────────────────────────────────────── */
#toasts{
  position:absolute;top:calc(var(--safe-t) + 68px);left:16px;right:16px;
  z-index:100;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center;
}
.toast{
  background:var(--text);color:var(--surface);padding:11px 20px;border-radius:100px;
  font-size:13px;font-weight:600;box-shadow:var(--sh);
  opacity:0;transform:translateY(-8px) scale(.95);transition:opacity .25s,transform .25s;
}
.toast.show{opacity:1;transform:none}

/* ── TIMEFRAME SELECTOR ──────────────────────────────── */
.tf-nav{
  display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:4px;margin-bottom:14px;
}
.tf-btn{
  flex:1;padding:8px 0;border:none;background:transparent;color:var(--text2);
  font:inherit;font-size:12px;font-weight:700;letter-spacing:.3px;border-radius:9px;
  cursor:pointer;transition:all .2s var(--ease);text-align:center;
}
.tf-btn.on{
  background:var(--surface);color:var(--text);box-shadow:var(--sh-sm);font-weight:800;
}

/* ── ACHIEVEMENT BANNER & MODAL ───────────────────────── */
.achieve-banner{
  background:linear-gradient(135deg,#1c1b29 0%,#35314a 100%);
  border-radius:var(--r);padding:14px 16px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  color:#fff;box-shadow:var(--sh-sm);position:relative;overflow:hidden;
}
.achieve-banner::after{
  content:'';position:absolute;top:-25px;right:-25px;width:90px;height:90px;
  border-radius:50%;background:rgba(252,76,2,.25);pointer-events:none;
}
:root[data-theme="dark"] .achieve-banner{background:linear-gradient(135deg,#15141d 0%,#29263a 100%)}
.ach-left{display:flex;align-items:center;gap:12px;min-width:0;position:relative;z-index:1}
.ach-icon{font-size:32px;flex-shrink:0}
.ach-title{font-size:14px;font-weight:800;display:block;letter-spacing:-.2px}
.ach-sub{font-size:11px;opacity:.82;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach-dl-btn{
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:9px 13px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;flex-shrink:0;box-shadow:0 3px 12px rgba(252,76,2,.4);
  transition:transform .15s;position:relative;z-index:1;
}
.ach-dl-btn:active{transform:scale(.95)}

.modal-canvas-wrap{
  border-radius:16px;overflow:hidden;margin:14px auto;background:#0d0d11;
  box-shadow:var(--sh-lg);display:flex;justify-content:center;max-width:300px;
}
.modal-canvas-wrap canvas{
  width:100%;height:auto;display:block;border-radius:14px;
}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1;padding:12px 8px;font-size:13px}

/* ── CHARTS (MONTH & YEAR) ───────────────────────────── */
.chart-subtitle{font-size:11px;color:var(--text2);margin-top:-8px;margin-bottom:12px;font-weight:500}
.m30-chart{display:flex;align-items:flex-end;gap:3px;height:96px;padding:0 1px}
.m30-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%}
.m30-bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end}
.m30-bar{width:100%;min-height:3px;border-radius:3px 3px 0 0;background:var(--surface2);transition:height .4s var(--ease)}
.m30-bar.hi{background:var(--accent)}
.m30-day{font-size:8px;color:var(--text2);font-weight:600}

.y12-chart{display:flex;align-items:flex-end;gap:5px;height:105px;padding:0 2px}
.y12-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%}
.y12-bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end}
.y12-bar{width:100%;min-height:4px;border-radius:4px 4px 0 0;background:var(--surface2);transition:height .4s var(--ease)}
.y12-bar.hi{background:var(--accent)}
.y12-bar.top{background:linear-gradient(180deg,#fc4c02,#ff9800)}
.y12-lbl{font-size:10px;color:var(--text2);font-weight:700}
.y12-cnt{font-size:9px;font-weight:700;color:var(--text);margin-bottom:2px}

.hof-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.hof-row:last-child{border-bottom:none}
.hof-rank{font-size:20px;font-weight:800;width:28px;text-align:center;flex-shrink:0}

/* ── A11Y ────────────────────────────────────────────── */
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hd-text">
      <h1 id="hd-title">Stride</h1>
      <p id="hd-sub"></p>
    </div>
    <div class="hd-actions">
      <button class="icon-btn" id="theme-btn" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main id="main"></main>

  <button class="fab" id="fab" aria-label="Add habit">+</button>

  <nav id="nav">
    <div class="nav-pill" id="pill"></div>
    <button data-v="today"><span class="ni">✦</span>Today</button>
    <button data-v="stats"><span class="ni">📈</span>Progress</button>
    <button data-v="habits"><span class="ni">⚙</span>Habits</button>
  </nav>

  <div id="toasts"></div>
</div>

<script>
/* ── CONSTANTS ───────────────────────────────────────── */
const COLORS=['#fc4c02','#1e88e5','#2e9e5b','#8e44ad','#e0a100','#d6336c','#0891b2','#059669'];
const EMOJI=['🏃','💧','📖','🧘','💪','😴','🥗','✍️','🎸','🚴','🧹','💊','🎯','🧠','☕','🌿'];
const DAYS=['M','T','W','T','F','S','S'];
const MOTIV=['Every habit counts. Keep going!','You\'re building something great.','Consistency is your superpower.','Small steps, big results.','Your future self thanks you.'];

/* ── STATE ───────────────────────────────────────────── */
let S={habits:[],logs:{}};
let view='today';
let statsTimeframe='week'; // 'week' | 'month' | 'year'

/* ── UTILS ───────────────────────────────────────────── */
const $=s=>document.querySelector(s);
const iso=d=>d.toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const done=(id,date)=>(S.logs[date]||[]).includes(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── TOAST ───────────────────────────────────────────── */
function toast(msg,ms=2600){
  const el=document.createElement('div');
  el.className='toast';el.textContent=msg;
  $('#toasts').appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)},ms);
}

/* ── API ─────────────────────────────────────────────── */
async function api(path,opt){
  const r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'}},opt));
  if(!r.ok)throw new Error(r.status);
  return r.status===204?null:r.json();
}
async function load(){
  let hasCache=false;
  try{
    const ch=localStorage.getItem('stride_cached_habits');
    const cl=localStorage.getItem('stride_cached_logs');
    if(ch&&cl){
      S.habits=JSON.parse(ch);
      S.logs=JSON.parse(cl);
      hasCache=true;
      render();
    }
  }catch(err){}

  try{
    const [habits,logs]=await Promise.all([api('/api/habits'),api('/api/logs?days=365')]);
    S.habits=habits;
    S.logs=logs;
    try{
      localStorage.setItem('stride_cached_habits',JSON.stringify(habits));
      localStorage.setItem('stride_cached_logs',JSON.stringify(logs));
    }catch(err){}
    render();
    return true;
  }catch(e){
    console.warn('Network sync failed:',e);
    if(hasCache&&S.habits.length){
      toast('⚡ Showing saved offline habits');
      return true;
    }
    $('#main').innerHTML=`<div class="empty">
      <div class="ei">⏳</div>
      <h3>Connecting to server…</h3>
      <p style="margin-top:6px;font-size:14px;color:var(--text2)">Server is waking up (takes ~30-45s on first launch).</p>
      <button class="btn btn-p" id="retry-load-btn" style="margin-top:16px;max-width:220px;margin-inline:auto">Retry Connection</button>
    </div>`;
    const rBtn=$('#retry-load-btn');
    if(rBtn)rBtn.onclick=()=>{skeleton();load()};
    setTimeout(()=>{
      if(!S.habits||!S.habits.length)load();
    },6000);
    return false;
  }
}

/* ── HELPERS ─────────────────────────────────────────── */
function streak(id){let d=new Date(),n=0;if(!done(id,iso(d)))d=addDays(d,-1);while(done(id,iso(d))){n++;d=addDays(d,-1)}return n}
function bestStreak(id){let b=0,c=0;for(let i=365;i>=0;i--){done(id,iso(addDays(new Date(),-i)))?(c++,b=Math.max(b,c)):c=0}return b}
function weekCount(id){const m=monday(new Date());let n=0;for(let i=0;i<7;i++)if(done(id,iso(addDays(m,i))))n++;return n}
function countDays(id,days){let n=0;const today=new Date();for(let i=0;i<days;i++)if(done(id,iso(addDays(today,-i))))n++;return n}

function getAchievement(totalCheckins, bestStreakVal){
  if(totalCheckins>=150||bestStreakVal>=40) return {title:'Titan of Discipline',emoji:'👑',rank:'Level 5 · Master',desc:'Unrivaled consistency and daily mastery'};
  if(totalCheckins>=75||bestStreakVal>=21) return {title:'Streak Champion',emoji:'⚡',rank:'Level 4 · Diamond',desc:'Deep momentum and formidable habit loops'};
  if(totalCheckins>=35||bestStreakVal>=10) return {title:'Habit Warrior',emoji:'🏆',rank:'Level 3 · Gold',desc:'Consistent daily actions turning into identity'};
  if(totalCheckins>=12||bestStreakVal>=4) return {title:'Momentum Builder',emoji:'🔥',rank:'Level 2 · Silver',desc:'Solid foundation and steady daily progress'};
  return {title:'Habit Architect',emoji:'🌱',rank:'Level 1 · Bronze',desc:'Taking the initial bold strides towards growth'};
}
function greeting(){const h=new Date().getHours();if(h<12)return'Good morning ☀️';if(h<17)return'Good afternoon 👋';if(h<21)return'Good evening 🌆';return'Good night 🌙'}

function weekDots(id){
  const today=new Date();today.setHours(0,0,0,0);
  const dow=(today.getDay()+6)%7;
  return DAYS.map((l,i)=>{
    const d=addDays(today,i-dow);
    const future=d>today,isDone=done(id,iso(d));
    return`<span class="dot ${isDone?'done':future?'future':'miss'}" title="${iso(d)}"></span>`;
  }).join('');
}

/* ── TOGGLE ──────────────────────────────────────────── */
async function toggle(id){
  const d=iso(new Date()),a=S.logs[d]||(S.logs[d]=[]),i=a.indexOf(id);
  i<0?a.push(id):a.splice(i,1);
  if('vibrate'in navigator)navigator.vibrate(i<0?[12]:[8,25,8]);
  try{localStorage.setItem('stride_cached_logs',JSON.stringify(S.logs))}catch(e){}
  renderMain();
  try{
    await api('/api/habits/'+id+'/toggle',{method:'POST',body:JSON.stringify({date:d})});
    const t=iso(new Date());
    if(S.habits.length&&S.habits.every(h=>done(h.id,t)))
      setTimeout(()=>toast('🎉 All done today — incredible!',3200),400);
  }catch(err){
    toast('⚡ Saved locally (will sync when online)');
    if('serviceWorker'in navigator){
      try{
        const reg=await navigator.serviceWorker.ready;
        const dbReq=indexedDB.open('stride-sync',1);
        dbReq.onupgradeneeded=()=>{dbReq.result.createObjectStore('pending',{keyPath:'id',autoIncrement:true})};
        dbReq.onsuccess=()=>{
          const tx=dbReq.result.transaction('pending','readwrite');
          tx.objectStore('pending').add({habitId:id,date:d,timestamp:Date.now()});
        };
        if('sync'in reg)await reg.sync.register('sync-toggles');
      }catch(e){}
    }
  }
}

/* ── VIEW: TODAY ─────────────────────────────────────── */
function vToday(){
  const H=S.habits,t=iso(new Date()),n=H.filter(h=>done(h.id,t)).length;
  if(!H.length)return`<div class="empty"><div class="ei">🌱</div><h3>No habits yet</h3><p>Tap the <strong>+</strong> button to create your first habit and start building your streak!</p></div>`;

  const pct=H.length?n/H.length:0;
  const R=42,CX=96,L=2*Math.PI*R;
  const msg=n===H.length?'🎉 All done today!':n===0?MOTIV[new Date().getDay()%MOTIV.length]:`${H.length-n} left — keep going!`;

  const rows=H.map(h=>{
    const isDone=done(h.id,t),s=streak(h.id),wc=weekCount(h.id);
    return`<div class="hab-row">
      <div class="hab-accent" style="background:${h.color}"></div>
      <div class="hab-ico" style="background:${h.color}1a">${h.emoji}</div>
      <div class="hab-info">
        <span class="hab-name">${esc(h.name)}</span>
        <div class="hab-meta">
          <span class="streak-pill">${s>0?'🔥':'○'} ${s}d streak</span>
          <div class="wk-dots">${weekDots(h.id)}</div>
          <span class="wk-txt" style="color:${h.color}">${wc}/${h.goal}wk</span>
        </div>
      </div>
      <button class="chk ${isDone?'on':''}" style="${isDone?'background:'+h.color+';border-color:'+h.color:''}" data-t="${h.id}" aria-label="${isDone?'Unmark':'Mark'} ${esc(h.name)}">
        <span class="chk-mark">✓</span>
      </button>
    </div>`;
  }).join('');

  return`<div class="hero">
    <div class="hero-inner">
      <svg class="ring-svg" width="${CX}" height="${CX}" viewBox="0 0 ${CX} ${CX}" role="img" aria-label="${n} of ${H.length} habits done today">
        <circle class="ring-bg" cx="${CX/2}" cy="${CX/2}" r="${R}" stroke-width="10"/>
        <circle class="ring-fg" cx="${CX/2}" cy="${CX/2}" r="${R}" stroke-width="10"
          stroke-dasharray="${(L*pct).toFixed(1)} ${L.toFixed(1)}"/>
        <text x="${CX/2}" y="${CX/2+1}" text-anchor="middle" dominant-baseline="middle"
          font-size="22" font-weight="800" font-style="italic" fill="white">${n}</text>
      </svg>
      <div class="hero-txt">
        <span class="big">${n}<sub>/${H.length}</sub></span>
        <span class="lbl">habits done today</span>
        <span class="msg">${msg}</span>
      </div>
    </div>
  </div>
  <div class="card"><div class="hab-list">${rows}</div></div>`;
}

/* ── VIEW: STATS ─────────────────────────────────────── */
function vStats(){
  const H=S.habits;
  if(!H.length)return`<div class="empty"><div class="ei">📊</div><h3>No data yet</h3><p>Add a habit and start tracking to see your progress here.</p></div>`;

  const today=new Date();

  // All-time & Year stats
  let totalYear=0;
  for(let i=0;i<365;i++){
    const d=iso(addDays(today,-i));
    totalYear+=(S.logs[d]||[]).length;
  }
  const bestAll=H.length?Math.max(...H.map(h=>bestStreak(h.id))):0;
  const yearPoss=365*H.length;
  const yearCons=yearPoss>0?Math.round(totalYear/yearPoss*100):0;
  const ach=getAchievement(totalYear,bestAll);

  // Timeframe selector
  const tfSelector=`<div class="tf-nav">
    <button class="tf-btn ${statsTimeframe==='week'?'on':''}" data-tf="week">Weekly</button>
    <button class="tf-btn ${statsTimeframe==='month'?'on':''}" data-tf="month">Monthly</button>
    <button class="tf-btn ${statsTimeframe==='year'?'on':''}" data-tf="year">Yearly</button>
  </div>`;

  // Achievement Spotlight banner
  const achBanner=`<div class="achieve-banner">
    <div class="ach-left">
      <span class="ach-icon">${ach.emoji}</span>
      <div>
        <span class="ach-title">${ach.title}</span>
        <span class="ach-sub">${ach.rank} · ${totalYear} check-ins</span>
      </div>
    </div>
    <button class="ach-dl-btn" data-act="ach-modal">🏆 Achievement</button>
  </div>`;

  let content='';

  /* ──────────────── WEEKLY VIEW ──────────────── */
  if(statsTimeframe==='week'){
    const wk=H.reduce((a,h)=>a+weekCount(h.id),0);
    const totalGoal=H.reduce((a,h)=>a+h.goal,0);
    const wkPct=totalGoal>0?Math.min(100,Math.round(wk/totalGoal*100)):0;
    const bestWk=H.length?Math.max(...H.map(h=>streak(h.id))):0;

    // 7-day bar chart
    const bars=Array.from({length:7},(_,i)=>{
      const d=addDays(today,i-6),cnt=(S.logs[iso(d)]||[]).length;
      return{l:DAYS[(d.getDay()+6)%7],p:H.length?cnt/H.length:0,cnt,isToday:i===6,date:iso(d)};
    });
    const barHTML=bars.map(b=>`<div class="bar-col">
      <div class="bar-wrap"><div class="bar-fill${b.p>0?' hi':''}" style="height:${Math.max(4,Math.round(b.p*96))}px" title="${b.date}: ${b.cnt} habits"></div></div>
      <div class="bar-day${b.isToday?' cur':''}">${b.l}</div>
    </div>`).join('');

    const habitBars=H.map(h=>{
      const c=weekCount(h.id),p=Math.min(1,c/h.goal),s=streak(h.id);
      return`<div class="hp-row">
        <div class="hp-top">
          <span class="hp-ico">${h.emoji}</span>
          <span class="hp-name">${esc(h.name)}</span>
          <span class="hp-cnt" style="color:${h.color}">${c}/${h.goal} days</span>
        </div>
        <div class="hp-bar"><div class="hp-fill" style="width:${Math.round(p*100)}%;background:${h.color}"></div></div>
        <div class="hp-sub">🔥 ${s}-day streak &nbsp;·&nbsp; ${p>=1?'🎯 Goal reached this week!':'In progress'}</div>
      </div>`;
    }).join('');

    content=`
      <div class="stat-grid">
        <div class="stat-card"><span class="stat-num">${wk}</span><span class="stat-lbl">Check-ins this week</span></div>
        <div class="stat-card"><span class="stat-num">${wkPct}%</span><span class="stat-lbl">Weekly goal progress</span></div>
        <div class="stat-card"><span class="stat-num">${bestWk}d</span><span class="stat-lbl">Current best streak</span></div>
      </div>
      <div class="card card-p">
        <div class="card-title">Last 7 Days Activity</div>
        <div class="bar-chart">${barHTML}</div>
      </div>
      <div class="card card-p">
        <div class="card-title">Weekly Goals Breakdown</div>
        <div class="hp-list">${habitBars}</div>
      </div>
    `;
  }

  /* ──────────────── MONTHLY VIEW ──────────────── */
  else if(statsTimeframe==='month'){
    let monthTotal=0,activeDays=0;
    for(let i=0;i<30;i++){
      const d=iso(addDays(today,-i));
      const cnt=(S.logs[d]||[]).length;
      monthTotal+=cnt;
      if(cnt>0)activeDays++;
    }
    const monthCons=Math.round((monthTotal/(30*H.length))*100);

    // 30-day bars
    const mBars=Array.from({length:30},(_,i)=>{
      const d=addDays(today,i-29),cnt=(S.logs[iso(d)]||[]).length;
      const isLabel=i%5===0||i===29;
      return`<div class="m30-col">
        <div class="m30-bar-wrap">
          <div class="m30-bar${cnt>0?' hi':''}" style="height:${Math.max(3,Math.round((cnt/H.length)*90))}px" title="${iso(d)}: ${cnt} done"></div>
        </div>
        ${isLabel?`<div class="m30-day">${d.getDate()}</div>`:''}
      </div>`;
    }).join('');

    // Habit breakdown for 30 days
    const habitMonthList=H.map(h=>{
      const cnt=countDays(h.id,30),pct=Math.round(cnt/30*100);
      return`<div class="hp-row">
        <div class="hp-top">
          <span class="hp-ico">${h.emoji}</span>
          <span class="hp-name">${esc(h.name)}</span>
          <span class="hp-cnt" style="color:${h.color}">${cnt}/30 days (${pct}%)</span>
        </div>
        <div class="hp-bar"><div class="hp-fill" style="width:${pct}%;background:${h.color}"></div></div>
      </div>`;
    }).join('');

    // 6-week heatmap
    const start6=addDays(monday(today),-35);
    let cells6='';
    for(let w=0;w<6;w++)for(let d=0;d<7;d++){
      const dt=addDays(start6,w*7+d);if(dt>today)continue;
      const p=H.length?(S.logs[iso(dt)]||[]).length/H.length:0;
      const op=p===0?0:(.2+p*.8);
      cells6+=`<rect x="${w*24}" y="${d*20}" width="20" height="16" rx="4"
        fill="${p?'var(--accent)':'var(--surface2)'}" ${p?`fill-opacity="${op.toFixed(2)}"`:''}>
        <title>${iso(dt)}: ${(S.logs[iso(dt)]||[]).length}/${H.length}</title></rect>`;
    }

    content=`
      <div class="stat-grid">
        <div class="stat-card"><span class="stat-num">${monthTotal}</span><span class="stat-lbl">30-day check-ins</span></div>
        <div class="stat-card"><span class="stat-num">${monthCons}%</span><span class="stat-lbl">30-day consistency</span></div>
        <div class="stat-card"><span class="stat-num">${activeDays}</span><span class="stat-lbl">Active days in month</span></div>
      </div>
      <div class="card card-p">
        <div class="card-title">Last 30 Days Daily Trend</div>
        <p class="chart-subtitle">Daily consistency over the last month</p>
        <div class="m30-chart">${mBars}</div>
      </div>
      <div class="card card-p">
        <div class="card-title">Habit Consistency (30 Days)</div>
        <div class="hp-list">${habitMonthList}</div>
      </div>
      <div class="card card-p">
        <div class="card-title">Recent 6 Weeks Activity</div>
        <div class="hmap-wrap">
          <svg viewBox="0 0 148 144" width="100%" role="img" aria-label="Monthly heatmap">${cells6}</svg>
        </div>
      </div>
    `;
  }

  /* ──────────────── YEARLY VIEW ──────────────── */
  else if(statsTimeframe==='year'){
    // 12-month data
    const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const curYear=today.getFullYear(),curMonth=today.getMonth();
    const monthsData=[];
    for(let m=11;m>=0;m--){
      const d=new Date(curYear,curMonth-m,1);
      const yr=d.getFullYear(),mo=d.getMonth();
      const prefix=`${yr}-${String(mo+1).padStart(2,'0')}`;
      let mTotal=0;
      Object.keys(S.logs).forEach(dayKey=>{
        if(dayKey.startsWith(prefix)) mTotal+=(S.logs[dayKey]||[]).length;
      });
      monthsData.push({label:monthNames[mo],count:mTotal,isCurrent:m===0});
    }
    const maxMonth=Math.max(...monthsData.map(x=>x.count),1);

    const yBars=monthsData.map(m=>`<div class="y12-col">
      <div class="y12-cnt">${m.count>0?m.count:''}</div>
      <div class="y12-bar-wrap">
        <div class="y12-bar${m.count===maxMonth&&m.count>0?' top':m.count>0?' hi':''}" style="height:${Math.max(4,Math.round((m.count/maxMonth)*80))}px" title="${m.label}: ${m.count} check-ins"></div>
      </div>
      <div class="y12-lbl" style="${m.isCurrent?'color:var(--accent)':''}">${m.label}</div>
    </div>`).join('');

    // 52-week heatmap
    const startYear=addDays(monday(today),-364);
    let cellsYear='';
    for(let w=0;w<52;w++)for(let d=0;d<7;d++){
      const dt=addDays(startYear,w*7+d);if(dt>today)continue;
      const cnt=(S.logs[iso(dt)]||[]).length;
      const p=H.length?cnt/H.length:0;
      const op=p===0?0:(.2+p*.8);
      cellsYear+=`<rect x="${w*13}" y="${d*14}" width="10" height="11" rx="2.5"
        fill="${p?'var(--accent)':'var(--surface2)'}" ${p?`fill-opacity="${op.toFixed(2)}"`:''}>
        <title>${iso(dt)}: ${cnt}/${H.length}</title></rect>`;
    }

    // Habit Hall of Fame (ranked by 365-day checkins)
    const medals=['🥇','🥈','🥉','🏅','🏅','🏅','🏅','🏅'];
    const sortedH=[...H].map(h=>({h,cnt:countDays(h.id,365),s:bestStreak(h.id)}))
      .sort((a,b)=>b.cnt-a.cnt);

    const hofRows=sortedH.map((item,idx)=>`<div class="hof-row">
      <div class="hof-rank">${medals[idx]||'•'}</div>
      <div class="hab-ico" style="background:${item.h.color}1a;border-radius:12px;width:38px;height:38px;font-size:20px;display:grid;place-items:center;flex-shrink:0">${item.h.emoji}</div>
      <div class="mg-info">
        <span class="mg-name">${esc(item.h.name)}</span>
        <span class="mg-goal">${item.cnt} check-ins in the year · Best ${item.s}d streak</span>
      </div>
    </div>`).join('');

    content=`
      <div class="stat-grid">
        <div class="stat-card"><span class="stat-num">${totalYear}</span><span class="stat-lbl">Annual check-ins</span></div>
        <div class="stat-card"><span class="stat-num">${yearCons}%</span><span class="stat-lbl">Yearly consistency</span></div>
        <div class="stat-card"><span class="stat-num">${bestAll}d</span><span class="stat-lbl">All-time best streak</span></div>
      </div>
      <div class="card card-p">
        <div class="card-title">12-Month Check-in Trend</div>
        <p class="chart-subtitle">Volume of completed habits across the past year</p>
        <div class="y12-chart">${yBars}</div>
      </div>
      <div class="card card-p">
        <div class="card-title">52-Week Full Heatmap</div>
        <div class="hmap-wrap">
          <svg viewBox="0 0 680 105" width="680" height="105" role="img" aria-label="52-week heatmap">${cellsYear}</svg>
        </div>
        <div class="hmap-legend">
          <span>52 weeks ago</span>
          <span>Today</span>
        </div>
      </div>
      <div class="card card-p">
        <div class="card-title">Habit Hall of Fame 🏆</div>
        <div>${hofRows}</div>
      </div>
    `;
  }

  return tfSelector + achBanner + content;
}

      <button class="btn btn-p" id="ach-btn-dl">⬇️ Download Card (PNG)</button>
      <div class="btn-row">
        <button class="btn btn-s" id="ach-btn-share">📲 Share Card</button>
        <button class="btn btn-s" id="ach-btn-export">📊 Export Data (JSON)</button>
      </div>
      <button class="btn btn-d" id="ach-btn-close">Close</button>
    </div>
  </div>`;

  $('#app').appendChild(ov);
  requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add('vis')));

  const canvas=ov.querySelector('#ach-canvas');
  drawAchievementCanvas(canvas,curTf);

  const close=()=>{
    ov.classList.remove('vis');
    setTimeout(()=>ov.remove(),350);
  };
  ov.addEventListener('click',e=>{if(e.target===ov)close()});
  ov.querySelector('#ach-btn-close').onclick=close;

  // Timeframe selector inside modal
  ov.querySelector('#ach-tf-wrap').addEventListener('click',e=>{
    const b=e.target.closest('[data-atf]');
    if(!b)return;
    curTf=b.dataset.atf;
    ov.querySelectorAll('#ach-tf-wrap .tf-btn').forEach(btn=>btn.classList.toggle('on',btn===b));
    drawAchievementCanvas(canvas,curTf);
  });

  // Download PNG
  ov.querySelector('#ach-btn-dl').onclick=()=>{
    canvas.toBlob(blob=>{
      if(!blob){toast('❌ Could not generate image');return}
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=`stride-achievement-${curTf}-${iso(new Date())}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('🏆 Achievement Card saved to downloads!');
    },'image/png');
  };

  // Share
  ov.querySelector('#ach-btn-share').onclick=async()=>{
    if(navigator.share&&navigator.canShare){
      canvas.toBlob(async blob=>{
        if(!blob)return;
        const file=new File([blob],`stride-achievement-${curTf}.png`,{type:'image/png'});
        if(navigator.canShare({files:[file]})){
          try{
            await navigator.share({
              title:'My Stride Habit Achievement',
              text:'Tracking my habits with Stride! Here is my progress certificate 🏃🔥',
              files:[file]
            });
            toast('✅ Shared successfully!');
            return;
          }catch(err){}
        }
        // Fallback
        ov.querySelector('#ach-btn-dl').click();
      },'image/png');
    }else{
      ov.querySelector('#ach-btn-dl').click();
    }
  };

  // Export JSON
  ov.querySelector('#ach-btn-export').onclick=async()=>{
    try{
      const data=await api('/api/export');
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=`stride-backup-${iso(new Date())}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('📊 All habit data exported as JSON!');
    }catch(err){
      toast('❌ Export failed');
    }
  };
}

/* ── CANVAS RENDER ENGINE ────────────────────────────── */
function drawAchievementCanvas(canvas,tf){
  const ctx=canvas.getContext('2d');
  const W=1080,H=1350;
  ctx.clearRect(0,0,W,H);

  const today=new Date();
  const habitList=S.habits;

  // Compute metrics based on timeframe
  let daysCount=7,tfLabel='WEEKLY PROGRESS CERTIFICATE';
  if(tf==='month'){daysCount=30;tfLabel='30-DAY HABIT RECORD';}
  else if(tf==='year'){daysCount=365;tfLabel='ANNUAL CONSISTENCY CERTIFICATE';}
  else if(tf==='all'){daysCount=365;tfLabel='LIFETIME ACHIEVEMENT AWARD';}

  let totalCheckins=0;
  for(let i=0;i<daysCount;i++){
    const d=iso(addDays(today,-i));
    totalCheckins+=(S.logs[d]||[]).length;
  }
  const possible=daysCount*Math.max(habitList.length,1);
  const consistency=Math.min(100,Math.round((totalCheckins/possible)*100));
  const bestStreakVal=habitList.length?Math.max(...habitList.map(h=>bestStreak(h.id))):0;
  const ach=getAchievement(totalCheckins,bestStreakVal);

  // 1. Background gradient
  const bgGrad=ctx.createLinearGradient(0,0,W,H);
  bgGrad.addColorStop(0,'#0d0d12');
  bgGrad.addColorStop(0.5,'#14141e');
  bgGrad.addColorStop(1,'#09090d');
  ctx.fillStyle=bgGrad;
  ctx.fillRect(0,0,W,H);

  // 2. Ambient background glows
  const glow1=ctx.createRadialGradient(200,220,10,200,220,450);
  glow1.addColorStop(0,'rgba(252,76,2,0.22)');
  glow1.addColorStop(1,'rgba(252,76,2,0)');
  ctx.fillStyle=glow1;
  ctx.fillRect(0,0,W,H);

  const glow2=ctx.createRadialGradient(880,1000,10,880,1000,500);
  glow2.addColorStop(0,'rgba(142,68,173,0.18)');
  glow2.addColorStop(1,'rgba(142,68,173,0)');
  ctx.fillStyle=glow2;
  ctx.fillRect(0,0,W,H);

  // 3. Inner Card outline
  ctx.save();
  ctx.lineWidth=2;
  ctx.strokeStyle='rgba(255,255,255,0.1)';
  roundRect(ctx,50,50,W-100,H-100,44);
  ctx.stroke();
  ctx.restore();

  // 4. Header branding
  ctx.fillStyle='#fc4c02';
  ctx.font='italic 800 42px Barlow, sans-serif';
  ctx.textAlign='center';
  ctx.fillText('STRIDE',W/2,130);

  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.font='600 18px Barlow, sans-serif';
  ctx.letterSpacing='4px';
  ctx.fillText(tfLabel,W/2,170);

  // 5. Badge Box & Icon
  ctx.save();
  const badgeBoxY=220;
  const bGrad=ctx.createLinearGradient(W/2-80,badgeBoxY,W/2+80,badgeBoxY+160);
  bGrad.addColorStop(0,'rgba(252,76,2,0.25)');
  bGrad.addColorStop(1,'rgba(255,107,53,0.08)');
  ctx.fillStyle=bGrad;
  ctx.strokeStyle='rgba(252,76,2,0.5)';
  ctx.lineWidth=3;
  roundRect(ctx,W/2-80,badgeBoxY,160,160,36);
  ctx.fill();
  ctx.stroke();

  // Emoji
  ctx.font='80px Apple Color Emoji, Segoe UI Emoji, sans-serif';
  ctx.textAlign='center';
  ctx.fillText(ach.emoji,W/2,badgeBoxY+110);
  ctx.restore();

  // 6. Title and Rank
  ctx.fillStyle='#ffffff';
  ctx.font='italic 800 48px Barlow, sans-serif';
  ctx.textAlign='center';
  ctx.fillText(ach.title.toUpperCase(),W/2,440);

  ctx.fillStyle='#fc4c02';
  ctx.font='700 22px Barlow, sans-serif';
  ctx.fillText(ach.rank.toUpperCase(),W/2,480);

  ctx.fillStyle='rgba(255,255,255,0.65)';
  ctx.font='500 20px Barlow, sans-serif';
  ctx.fillText(ach.desc,W/2,516);

  // 7. Stat Cards (3 Columns)
  const statY=570,statW=280,statH=160,gap=30;
  const startX=W/2-(statW*3+gap*2)/2;

  const stats=[
    {num:String(totalCheckins),lbl:'TOTAL CHECK-INS',sub:daysCount+' days'},
    {num:consistency+'%',lbl:'CONSISTENCY',sub:'verified rate'},
    {num:bestStreakVal+'d',lbl:'PEAK STREAK',sub:'consecutive days'}
  ];

  stats.forEach((st,i)=>{
    const x=startX+i*(statW+gap);
    ctx.save();
    ctx.fillStyle='rgba(255,255,255,0.04)';
    ctx.strokeStyle='rgba(255,255,255,0.1)';
    ctx.lineWidth=1.5;
    roundRect(ctx,x,statY,statW,statH,24);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle='#ffffff';
    ctx.font='italic 800 50px Barlow, sans-serif';
    ctx.textAlign='center';
    ctx.fillText(st.num,x+statW/2,statY+72);

    ctx.fillStyle='#fc4c02';
    ctx.font='700 14px Barlow, sans-serif';
    ctx.fillText(st.lbl,x+statW/2,statY+108);

    ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.font='500 13px Barlow, sans-serif';
    ctx.fillText(st.sub,x+statW/2,statY+134);
    ctx.restore();
  });

  // 8. Habit Showcase
  const habitY=780;
  ctx.fillStyle='rgba(255,255,255,0.45)';
  ctx.font='700 14px Barlow, sans-serif';
  ctx.textAlign='left';
  ctx.fillText('TOP HABITS SHOWCASE',startX,habitY-16);

  const topHabits=[...habitList].slice(0,4);
  topHabits.forEach((h,idx)=>{
    const rowY=habitY+idx*88;
    const s=streak(h.id);
    const cnt=countDays(h.id,daysCount);

    ctx.save();
    ctx.fillStyle='rgba(255,255,255,0.03)';
    ctx.strokeStyle='rgba(255,255,255,0.08)';
    ctx.lineWidth=1;
    roundRect(ctx,startX,rowY,statW*3+gap*2,74,18);
    ctx.fill();
    ctx.stroke();

    // Icon container
    ctx.fillStyle=h.color+'28';
    roundRect(ctx,startX+14,rowY+12,50,50,14);
    ctx.fill();
    ctx.font='28px Apple Color Emoji, Segoe UI Emoji, sans-serif';
    ctx.textAlign='center';
    ctx.fillText(h.emoji,startX+39,rowY+48);

    // Name
    ctx.fillStyle='#ffffff';
    ctx.font='700 22px Barlow, sans-serif';
    ctx.textAlign='left';
    ctx.fillText(h.name.length>22?h.name.slice(0,20)+'…':h.name,startX+78,rowY+38);

    // Streak / Count
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.font='500 16px Barlow, sans-serif';
    ctx.fillText(`🔥 ${s}-day streak  ·  ${cnt} check-ins`,startX+78,rowY+60);

    // Accent indicator
    ctx.fillStyle=h.color;
    roundRect(ctx,startX+(statW*3+gap*2)-14,rowY+18,6,38,3);
    ctx.fill();
    ctx.restore();
  });

  // 9. Motivational quote
  ctx.fillStyle='rgba(255,255,255,0.65)';
  ctx.font='italic 500 20px Barlow, sans-serif';
  ctx.textAlign='center';
  ctx.fillText('“Small daily disciplines repeated with consistency lead to great achievements.”',W/2,1180);

  // 10. Footer stamp
  const dateStr=today.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.font='600 16px Barlow, sans-serif';
  ctx.fillText(`VERIFIED ON ${dateStr.toUpperCase()}  ·  STRIDE HABIT TRACKER`,W/2,1235);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

/* ── VIEW: HABITS ────────────────────────────────────── */
function vHabits(){
  if(!S.habits.length)return`<div class="empty"><div class="ei">⚙️</div><h3>No habits yet</h3><p>Tap <strong>+</strong> to add your first habit.</p></div>`;
  const rows=S.habits.map(h=>`<div class="mg-row">
    <div class="hab-ico" style="background:${h.color}1a;border-radius:14px;width:44px;height:44px;font-size:22px;display:grid;place-items:center;flex-shrink:0">${h.emoji}</div>
    <div class="mg-info">
      <span class="mg-name">${esc(h.name)}</span>
      <span class="mg-goal">${h.goal} day${h.goal>1?'s':''} per week · 🔥 ${streak(h.id)}-day streak</span>
    </div>
    <button class="edit-btn" data-e="${h.id}">Edit</button>
  </div>`).join('');
  return`<div class="card">${rows}</div>`;
}

/* ── SHEET ───────────────────────────────────────────── */
function sheet(id){
  const h=S.habits.find(x=>x.id===id)||{name:'',emoji:EMOJI[0],color:COLORS[0],goal:5};
  let em=h.emoji,co=h.color;

  const ov=document.createElement('div');ov.className='sh-bg';
  ov.innerHTML=`<div class="sh" role="dialog" aria-modal="true">
    <div class="sh-handle"></div>
    <h3>${id?'Edit habit':'New habit'}</h3>
    <div class="fl">
      <label class="fl-lbl" for="sh-nm">Name</label>
      <input class="fl-inp" type="text" id="sh-nm" maxlength="40" autocomplete="off" value="${esc(h.name)}" placeholder="e.g. Meditate 10 minutes">
    </div>
    <div class="fl">
      <label class="fl-lbl">Icon</label>
      <div class="pick-grid" id="sh-em">${EMOJI.map(e=>`<button class="pick-opt${e===em?' on':''}" data-v="${e}">${e}</button>`).join('')}</div>
    </div>
    <div class="fl">
      <label class="fl-lbl">Colour</label>
      <div class="pick-grid" id="sh-co">${COLORS.map(c=>`<button class="col-opt${c===co?' on':''}" data-v="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div>
    </div>
    <div class="fl">
      <label class="fl-lbl">Weekly goal</label>
      <div class="goal-big" id="sh-gv">${h.goal}</div>
      <div class="goal-sub">days per week</div>
      <input type="range" id="sh-gl" min="1" max="7" value="${h.goal}" aria-label="Weekly goal">
    </div>
    <div class="btn-col">
      <button class="btn btn-p" id="sh-sv">${id?'Save changes':'Create habit'}</button>
      <button class="btn btn-s" id="sh-cn">Cancel</button>
      ${id?'<button class="btn btn-d" id="sh-dl">Delete habit</button>':''}
    </div>
  </div>`;

  $('#app').appendChild(ov);
  $('#fab').classList.add('open');
  requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add('vis')));

  const close=()=>{
    ov.classList.remove('vis');$('#fab').classList.remove('open');
    setTimeout(()=>ov.remove(),350);
  };
  ov.addEventListener('click',e=>{if(e.target===ov)close()});

  ov.querySelector('#sh-em').addEventListener('click',e=>{
    const b=e.target.closest('.pick-opt');if(!b)return;
    em=b.dataset.v;ov.querySelectorAll('#sh-em .pick-opt').forEach(x=>x.classList.toggle('on',x===b));
  });
  ov.querySelector('#sh-co').addEventListener('click',e=>{
    const b=e.target.closest('.col-opt');if(!b)return;
    co=b.dataset.v;ov.querySelectorAll('#sh-co .col-opt').forEach(x=>x.classList.toggle('on',x===b));
  });
  ov.querySelector('#sh-gl').oninput=e=>ov.querySelector('#sh-gv').textContent=e.target.value;
  ov.querySelector('#sh-cn').onclick=close;

  ov.querySelector('#sh-sv').onclick=async()=>{
    const name=ov.querySelector('#sh-nm').value.trim();
    if(!name){ov.querySelector('#sh-nm').focus();return}
    const goal=+ov.querySelector('#sh-gl').value;
    const btn=ov.querySelector('#sh-sv');
    btn.textContent='Saving…';btn.disabled=true;
    try{
      if(id){const u=await api('/api/habits/'+id,{method:'PUT',body:JSON.stringify({name,emoji:em,color:co,goal})});Object.assign(S.habits.find(x=>x.id===id),u);toast('✅ Habit updated!')}
      else{S.habits.push(await api('/api/habits',{method:'POST',body:JSON.stringify({name,emoji:em,color:co,goal})}));toast('🌱 Habit created!')}
      try{localStorage.setItem('stride_cached_habits',JSON.stringify(S.habits))}catch(e){}
      close();renderMain();
    }catch(err){
      toast('❌ Could not save. Try again.');
      btn.textContent=id?'Save changes':'Create habit';btn.disabled=false;
    }
  };

  const dl=ov.querySelector('#sh-dl');
  if(dl)dl.onclick=async()=>{
    if(!confirm('Delete this habit and all its history?'))return;
    dl.textContent='Deleting…';dl.disabled=true;
    try{await api('/api/habits/'+id,{method:'DELETE'});S.habits=S.habits.filter(x=>x.id!==id);try{localStorage.setItem('stride_cached_habits',JSON.stringify(S.habits))}catch(e){};toast('🗑️ Habit deleted.');close();renderMain()}
    catch(err){toast('❌ Could not delete.');dl.textContent='Delete habit';dl.disabled=false}
  };
}

/* ── SKELETON ────────────────────────────────────────── */
function skeleton(){
  $('#main').innerHTML=`
    <div style="height:120px;border-radius:var(--r-lg);margin-bottom:14px" class="skel"></div>
    <div class="card">
      ${Array.from({length:3},()=>`<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)">
        <div class="skel" style="width:44px;height:44px;border-radius:14px;flex-shrink:0"></div>
        <div style="flex:1"><div class="skel" style="height:13px;width:55%;margin-bottom:8px"></div><div class="skel" style="height:9px;width:38%"></div></div>
        <div class="skel" style="width:44px;height:44px;border-radius:50%"></div>
      </div>`).join('')}
    </div>`;
}

/* ── RENDER ──────────────────────────────────────────── */
function renderMain(){
  $('#main').innerHTML={today:vToday,stats:vStats,habits:vHabits}[view]();
  // Animate stat bars after paint
  if(view==='stats'){
    requestAnimationFrame(()=>{
      document.querySelectorAll('.hp-fill').forEach(el=>{const w=el.style.width;el.style.width='0';requestAnimationFrame(()=>el.style.width=w)});
    });
  }
}

function render(){
  const titles={today:greeting,stats:()=>'Progress',habits:()=>`Habits (${S.habits.length})`};
  const subs={
    today:()=>new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'}),
    stats:()=>'Your consistency at a glance',
    habits:()=>S.habits.length?'Tap a habit to edit':'Add your first habit below'
  };
  $('#hd-title').textContent=titles[view]();
  $('#hd-sub').textContent=subs[view]();
  renderMain();

  // Nav pill
  document.querySelectorAll('nav button').forEach((b,i)=>{
    b.classList.toggle('on',b.dataset.v===view);
    if(b.dataset.v===view){
      const nw=$('#nav').offsetWidth,pw=Math.round(nw/3-12);
      $('#pill').style.cssText=`left:${i*Math.round(nw/3)+6}px;width:${pw}px`;
    }
  });
  $('#fab').style.display=view==='stats'?'none':'grid';
}

/* ── EVENTS ──────────────────────────────────────────── */
$('#main').addEventListener('click',e=>{
  const t=e.target.closest('[data-t]'),x=e.target.closest('[data-e]');
  const tf=e.target.closest('.tf-btn');
  const ach=e.target.closest('[data-act="ach-modal"]');
  if(t)toggle(t.dataset.t);
  if(x)sheet(x.dataset.e);
  if(tf){statsTimeframe=tf.dataset.tf;renderMain()}
  if(ach)openAchievementModal(statsTimeframe);
});
$('#nav').addEventListener('click',e=>{
  const b=e.target.closest('button[data-v]');
  if(b){view=b.dataset.v;render();$('#main').scrollTop=0}
});
$('#fab').onclick=()=>sheet();

// Theme toggle
(()=>{
  const html=document.documentElement;
  const isDark=()=>html.dataset.theme==='dark'||((!html.dataset.theme||html.dataset.theme==='auto')&&matchMedia('(prefers-color-scheme:dark)').matches);
  $('#theme-btn').textContent=isDark()?'☀️':'🌙';
  $('#theme-btn').onclick=()=>{
    html.dataset.theme=isDark()?'light':'dark';
    $('#theme-btn').textContent=isDark()?'☀️':'🌙';
  };
})();

// URL shortcut deep-link
const urlV=new URLSearchParams(location.search).get('view');
if(['today','stats','habits'].includes(urlV))view=urlV;

/* ── SERVICE WORKER ──────────────────────────────────── */
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('/sw.js').then(async reg=>{
    if('Notification'in window&&Notification.permission==='default'){
      const p=await Notification.requestPermission();
      if(p==='granted'&&'periodicSync'in reg)
        try{await reg.periodicSync.register('daily-reminder',{minInterval:86400000})}catch(e){}
    }else if(Notification.permission==='granted'&&'periodicSync'in reg){
      try{await reg.periodicSync.register('daily-reminder',{minInterval:86400000})}catch(e){}
    }
  }).catch(()=>{});
}

/* ── BOOT ────────────────────────────────────────────── */
skeleton();
load().then(ok=>{if(ok)render()});
</script>
