<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fc4c02">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<title>Stride – Habit Tracker</title>
<style>
/* ── TOKENS ──────────────────────────────────────────── */
:root{
  --bg:#f5f5f3;--surface:#fff;--surface2:#f0f0ee;--border:#e8e8e4;
  --text:#1a1a1c;--text2:#6b6b72;
  --accent:#fc4c02;--accent-soft:#fff0e9;--accent-dark:#d93c00;
  --sh-sm:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --sh:0 4px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --sh-lg:0 12px 40px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.06);
  --r:14px;--r-lg:22px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:68px;
  --ease:cubic-bezier(.4,0,.2,1);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f11;--surface:#1c1c1f;--surface2:#252528;--border:#2e2e33;
    --text:#f0f0f2;--text2:#8e8e96;--accent-soft:#2d1409;
    --sh-sm:0 1px 3px rgba(0,0,0,.35);
    --sh:0 4px 16px rgba(0,0,0,.35);
    --sh-lg:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0f11;--surface:#1c1c1f;--surface2:#252528;--border:#2e2e33;
  --text:#f0f0f2;--text2:#8e8e96;--accent-soft:#2d1409;
  --sh-sm:0 1px 3px rgba(0,0,0,.35);
  --sh:0 4px 16px rgba(0,0,0,.35);
  --sh-lg:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ── RESET ───────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);
  font-family:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}

/* ── SHELL ───────────────────────────────────────────── */
#app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ── HEADER ──────────────────────────────────────────── */
header{
  padding:calc(var(--safe-t) + 14px) 20px 10px;
  display:flex;align-items:flex-start;justify-content:space-between;
  flex-shrink:0;gap:12px;
}
.hd-text h1{font-size:26px;font-weight:800;font-style:italic;letter-spacing:-.5px;line-height:1.1}
.hd-text p{font-size:13px;color:var(--text2);margin-top:3px;font-weight:500}
.hd-actions{display:flex;gap:8px;padding-top:4px}
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:var(--surface2);color:var(--text);font-size:17px;
  display:grid;place-items:center;cursor:pointer;
  transition:.2s var(--ease);box-shadow:var(--sh-sm);
}
.icon-btn:active{transform:scale(.9)}

/* ── MAIN ────────────────────────────────────────────── */
main{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:4px 16px calc(var(--nav-h) + var(--safe-b) + 76px);
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
main::-webkit-scrollbar{display:none}

/* ── CARDS ───────────────────────────────────────────── */
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--sh-sm);margin-bottom:12px;overflow:hidden}
.card-p{padding:16px}
.card-title{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text2);margin-bottom:14px}

/* ── HERO ────────────────────────────────────────────── */
.hero{
  background:linear-gradient(140deg,var(--accent) 0%,#ff6b35 100%);
  border-radius:var(--r-lg);padding:22px 20px;margin-bottom:14px;
  position:relative;overflow:hidden;
  box-shadow:0 8px 32px rgba(252,76,2,.35);
}
.hero::before{
  content:'';position:absolute;top:-50px;right:-50px;
  width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);
}
.hero::after{
  content:'';position:absolute;bottom:-30px;right:50px;
  width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.05);
}
.hero-inner{display:flex;align-items:center;gap:18px;position:relative;z-index:1}
.hero-txt .big{font-size:42px;font-weight:800;font-style:italic;line-height:1;color:#fff;display:block}
.hero-txt .big sub{font-size:22px;opacity:.7;font-style:normal}
.hero-txt .lbl{font-size:14px;color:rgba(255,255,255,.88);margin-top:4px;display:block;font-weight:600}
.hero-txt .msg{font-size:12px;color:rgba(255,255,255,.7);margin-top:6px;display:block;font-weight:500}
.ring-svg{flex-shrink:0}
.ring-bg{fill:none;stroke:rgba(255,255,255,.2)}
.ring-fg{fill:none;stroke:#fff;stroke-linecap:round;transform-origin:center;transform:rotate(-90deg);transition:stroke-dasharray .7s var(--ease)}

/* ── HABIT ROWS ──────────────────────────────────────── */
.hab-row{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--border);position:relative;
  transition:background .15s;
}
.hab-row:last-child{border-bottom:none}
.hab-row:active{background:var(--surface2)}
.hab-accent{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0}
.hab-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.hab-info{flex:1;min-width:0}
.hab-name{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.hab-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.streak-pill{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--text2)}
.wk-dots{display:flex;gap:3px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.done{background:var(--accent)}
.dot.miss{background:var(--border)}
.dot.future{background:transparent;border:1.5px solid var(--border)}
.wk-txt{font-size:11px;font-weight:600}

/* Check button */
.chk{
  width:44px;height:44px;border-radius:50%;border:2.5px solid var(--border);
  background:transparent;cursor:pointer;flex-shrink:0;
  display:grid;place-items:center;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s;
  position:relative;overflow:hidden;
}
.chk-mark{font-size:19px;color:#fff;opacity:0;transform:scale(.3);
  transition:opacity .2s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.chk.on{border-color:transparent;transform:scale(1.08)}
.chk.on .chk-mark{opacity:1;transform:scale(1)}
/* ripple */
.chk::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--accent);transform:scale(0);opacity:.15;transition:transform .4s,opacity .4s}
.chk:active::after{transform:scale(1.5);opacity:0;transition:0s}

/* ── STAT GRID ───────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 10px;text-align:center;box-shadow:var(--sh-sm)}
.stat-num{display:block;font-size:28px;font-weight:800;font-style:italic;color:var(--accent);line-height:1}
.stat-lbl{display:block;font-size:11px;color:var(--text2);margin-top:4px;font-weight:600;line-height:1.3}

/* Bar chart */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:96px;padding:0 2px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end}
.bar-fill{width:100%;min-height:4px;border-radius:5px 5px 0 0;background:var(--border);transition:height .5s var(--ease)}
.bar-fill.hi{background:var(--accent)}
.bar-day{font-size:10px;font-weight:700;color:var(--text2)}
.bar-day.cur{color:var(--accent)}

/* Heatmap */
.hmap-wrap{overflow-x:auto;padding-bottom:2px}
.hmap-wrap::-webkit-scrollbar{height:3px}
.hmap-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.hmap-legend{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text2);margin-top:8px;font-weight:500}
.hmap-swatches{display:flex;gap:3px;align-items:center}
.hmap-swatches span{width:11px;height:11px;border-radius:3px}

/* Habit progress bars */
.hp-list{display:flex;flex-direction:column;gap:14px}
.hp-row{}
.hp-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.hp-ico{font-size:15px}
.hp-name{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp-cnt{font-size:12px;color:var(--text2);font-weight:700;flex-shrink:0}
.hp-bar{height:7px;background:var(--surface2);border-radius:10px;overflow:hidden}
.hp-fill{height:100%;border-radius:10px;transition:width .6s var(--ease)}
.hp-sub{font-size:11px;color:var(--text2);margin-top:5px;font-weight:500}

/* ── HABITS MANAGE ───────────────────────────────────── */
.mg-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.mg-row:last-child{border-bottom:none}
.mg-info{flex:1;min-width:0}
.mg-name{font-size:15px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-goal{font-size:12px;color:var(--text2);margin-top:2px;display:block;font-weight:500}
.edit-btn{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--text);font:inherit;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;transition:.2s var(--ease)}
.edit-btn:active{background:var(--surface2)}

/* ── NAV ─────────────────────────────────────────────── */
nav{
  display:flex;border-top:1px solid var(--border);background:var(--surface);
  padding-bottom:var(--safe-b);flex-shrink:0;position:relative;
  box-shadow:0 -4px 20px rgba(0,0,0,.06);
}
.nav-pill{
  position:absolute;top:8px;
  height:calc(100% - 16px - var(--safe-b));
  background:var(--accent-soft);border-radius:10px;
  transition:left .25s var(--ease),width .25s var(--ease);
  pointer-events:none;
}
nav button{
  flex:1;padding:9px 0 11px;border:0;background:none;color:var(--text2);
  font:inherit;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  position:relative;z-index:1;transition:color .2s;
}
nav button .ni{font-size:20px;line-height:1}
nav button.on{color:var(--accent)}

/* ── FAB ─────────────────────────────────────────────── */
.fab{
  position:absolute;right:16px;
  bottom:calc(var(--nav-h) + var(--safe-b) + 10px);
  width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;
  font-size:30px;font-weight:300;line-height:1;
  display:grid;place-items:center;cursor:pointer;z-index:10;
  box-shadow:0 6px 24px rgba(252,76,2,.45);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;
}
.fab:active{transform:scale(.88)}
.fab.open{transform:rotate(45deg)}

/* ── SHEET ───────────────────────────────────────────── */
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,0);z-index:20;display:flex;align-items:flex-end;transition:background .3s}
.sh-bg.vis{background:rgba(0,0,0,.55)}
.sh{
  background:var(--surface);width:100%;
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:0 20px calc(var(--safe-b) + 24px);
  max-height:92%;overflow-y:auto;
  transform:translateY(100%);transition:transform .35s var(--ease);
  box-shadow:var(--sh-lg);
}
.sh-bg.vis .sh{transform:translateY(0)}
.sh::-webkit-scrollbar{display:none}
.sh-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 20px}
.sh h3{font-size:20px;font-weight:800;color:var(--text);margin-bottom:20px}
.fl{margin-bottom:18px}
.fl-lbl{display:block;font-size:11px;font-weight:800;color:var(--text2);letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
.fl-inp{
  width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--surface2);color:var(--text);font:inherit;font-size:15px;font-weight:500;outline:none;
  transition:border-color .2s;
}
.fl-inp:focus{border-color:var(--accent)}
.pick-grid{display:flex;flex-wrap:wrap;gap:8px}
.pick-opt{
  width:44px;height:44px;border-radius:12px;border:2px solid transparent;
  background:var(--surface2);font-size:21px;cursor:pointer;
  display:grid;place-items:center;transition:.2s var(--ease);
}
.pick-opt.on{border-color:var(--text);transform:scale(1.1)}
.col-opt{
  width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;
  transition:.2s var(--ease);position:relative;
}
.col-opt.on::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800}
.goal-big{text-align:center;font-size:40px;font-weight:800;font-style:italic;color:var(--accent);line-height:1;padding:6px 0}
.goal-sub{text-align:center;font-size:12px;color:var(--text2);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);margin:12px 0}
.btn-col{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.btn{padding:15px;border-radius:12px;border:none;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:.15s var(--ease)}
.btn-p{background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(252,76,2,.3)}
.btn-p:active{transform:scale(.97)}
.btn-s{background:var(--surface2);color:var(--text)}
.btn-d{background:transparent;color:#ef4444}

/* ── EMPTY ───────────────────────────────────────────── */
.empty{text-align:center;padding:52px 24px;color:var(--text2)}
.empty .ei{font-size:56px;margin-bottom:16px}
.empty h3{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px}
.empty p{font-size:14px;line-height:1.6}

/* ── SKELETON ────────────────────────────────────────── */
@keyframes shimmer{from{background-position:-600px 0}to{background-position:600px 0}}
.skel{
  background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);
  background-size:1200px 100%;animation:shimmer 1.6s infinite;border-radius:8px;
}

/* ── TOAST ───────────────────────────────────────────── */
#toasts{
  position:absolute;top:calc(var(--safe-t) + 68px);left:16px;right:16px;
  z-index:100;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center;
}
.toast{
  background:var(--text);color:var(--surface);padding:11px 20px;border-radius:100px;
  font-size:13px;font-weight:600;box-shadow:var(--sh);
  opacity:0;transform:translateY(-8px) scale(.95);transition:opacity .25s,transform .25s;
}
.toast.show{opacity:1;transform:none}

/* ── A11Y ────────────────────────────────────────────── */
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hd-text">
      <h1 id="hd-title">Stride</h1>
      <p id="hd-sub"></p>
    </div>
    <div class="hd-actions">
      <button class="icon-btn" id="theme-btn" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main id="main"></main>

  <button class="fab" id="fab" aria-label="Add habit">+</button>

  <nav id="nav">
    <div class="nav-pill" id="pill"></div>
    <button data-v="today"><span class="ni">✦</span>Today</button>
    <button data-v="stats"><span class="ni">📈</span>Progress</button>
    <button data-v="habits"><span class="ni">⚙</span>Habits</button>
  </nav>

  <div id="toasts"></div>
</div>

<script>
/* ── CONSTANTS ───────────────────────────────────────── */
const COLORS=['#fc4c02','#1e88e5','#2e9e5b','#8e44ad','#e0a100','#d6336c','#0891b2','#059669'];
const EMOJI=['🏃','💧','📖','🧘','💪','😴','🥗','✍️','🎸','🚴','🧹','💊','🎯','🧠','☕','🌿'];
const DAYS=['M','T','W','T','F','S','S'];
const MOTIV=['Every habit counts. Keep going!','You\'re building something great.','Consistency is your superpower.','Small steps, big results.','Your future self thanks you.'];

/* ── STATE ───────────────────────────────────────────── */
let S={habits:[],logs:{}};
let view='today';

/* ── UTILS ───────────────────────────────────────────── */
const $=s=>document.querySelector(s);
const iso=d=>d.toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const done=(id,date)=>(S.logs[date]||[]).includes(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── TOAST ───────────────────────────────────────────── */
function toast(msg,ms=2600){
  const el=document.createElement('div');
  el.className='toast';el.textContent=msg;
  $('#toasts').appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)},ms);
}

/* ── API ─────────────────────────────────────────────── */
async function api(path,opt){
  const r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'}},opt));
  if(!r.ok)throw new Error(r.status);
  return r.status===204?null:r.json();
}
async function load(){
  try{
    [S.habits,S.logs]=await Promise.all([api('/api/habits'),api('/api/logs?days=130')]);
    return true;
  }catch(e){
    $('#main').innerHTML=`<div class="empty"><div class="ei">📡</div><h3>Can't reach server</h3><p>Check your connection and reload.</p></div>`;
    return false;
  }
}

/* ── HELPERS ─────────────────────────────────────────── */
function streak(id){let d=new Date(),n=0;if(!done(id,iso(d)))d=addDays(d,-1);while(done(id,iso(d))){n++;d=addDays(d,-1)}return n}
function bestStreak(id){let b=0,c=0;for(let i=120;i>=0;i--){done(id,iso(addDays(new Date(),-i)))?(c++,b=Math.max(b,c)):c=0}return b}
function weekCount(id){const m=monday(new Date());let n=0;for(let i=0;i<7;i++)if(done(id,iso(addDays(m,i))))n++;return n}
function greeting(){const h=new Date().getHours();if(h<12)return'Good morning ☀️';if(h<17)return'Good afternoon 👋';if(h<21)return'Good evening 🌆';return'Good night 🌙'}

function weekDots(id){
  const today=new Date();today.setHours(0,0,0,0);
  const dow=(today.getDay()+6)%7;
  return DAYS.map((l,i)=>{
    const d=addDays(today,i-dow);
    const future=d>today,isDone=done(id,iso(d));
    return`<span class="dot ${isDone?'done':future?'future':'miss'}" title="${iso(d)}"></span>`;
  }).join('');
}

/* ── TOGGLE ──────────────────────────────────────────── */
async function toggle(id){
  const d=iso(new Date()),a=S.logs[d]||(S.logs[d]=[]),i=a.indexOf(id);
  i<0?a.push(id):a.splice(i,1);
  if('vibrate'in navigator)navigator.vibrate(i<0?[12]:[8,25,8]);
  renderMain();
  try{
    await api('/api/habits/'+id+'/toggle',{method:'POST',body:JSON.stringify({date:d})});
    const t=iso(new Date());
    if(S.habits.length&&S.habits.every(h=>done(h.id,t)))
      setTimeout(()=>toast('🎉 All done today — incredible!',3200),400);
  }catch(err){
    const j=a.indexOf(id);j<0?a.push(id):a.splice(j,1);
    renderMain();toast('⚠️ Could not save. Check connection.');
  }
}

/* ── VIEW: TODAY ─────────────────────────────────────── */
function vToday(){
  const H=S.habits,t=iso(new Date()),n=H.filter(h=>done(h.id,t)).length;
  if(!H.length)return`<div class="empty"><div class="ei">🌱</div><h3>No habits yet</h3><p>Tap the <strong>+</strong> button to create your first habit and start building your streak!</p></div>`;

  const pct=H.length?n/H.length:0;
  const R=42,CX=96,L=2*Math.PI*R;
  const msg=n===H.length?'🎉 All done today!':n===0?MOTIV[new Date().getDay()%MOTIV.length]:`${H.length-n} left — keep going!`;

  const rows=H.map(h=>{
    const isDone=done(h.id,t),s=streak(h.id),wc=weekCount(h.id);
    return`<div class="hab-row">
      <div class="hab-accent" style="background:${h.color}"></div>
      <div class="hab-ico" style="background:${h.color}1a">${h.emoji}</div>
      <div class="hab-info">
        <span class="hab-name">${esc(h.name)}</span>
        <div class="hab-meta">
          <span class="streak-pill">${s>0?'🔥':'○'} ${s}d streak</span>
          <div class="wk-dots">${weekDots(h.id)}</div>
          <span class="wk-txt" style="color:${h.color}">${wc}/${h.goal}wk</span>
        </div>
      </div>
      <button class="chk ${isDone?'on':''}" style="${isDone?'background:'+h.color+';border-color:'+h.color:''}" data-t="${h.id}" aria-label="${isDone?'Unmark':'Mark'} ${esc(h.name)}">
        <span class="chk-mark">✓</span>
      </button>
    </div>`;
  }).join('');

  return`<div class="hero">
    <div class="hero-inner">
      <svg class="ring-svg" width="${CX}" height="${CX}" viewBox="0 0 ${CX} ${CX}" role="img" aria-label="${n} of ${H.length} habits done today">
        <circle class="ring-bg" cx="${CX/2}" cy="${CX/2}" r="${R}" stroke-width="10"/>
        <circle class="ring-fg" cx="${CX/2}" cy="${CX/2}" r="${R}" stroke-width="10"
          stroke-dasharray="${(L*pct).toFixed(1)} ${L.toFixed(1)}"/>
        <text x="${CX/2}" y="${CX/2+1}" text-anchor="middle" dominant-baseline="middle"
          font-size="22" font-weight="800" font-style="italic" fill="white">${n}</text>
      </svg>
      <div class="hero-txt">
        <span class="big">${n}<sub>/${H.length}</sub></span>
        <span class="lbl">habits done today</span>
        <span class="msg">${msg}</span>
      </div>
    </div>
  </div>
  <div class="card"><div class="hab-list">${rows}</div></div>`;
}

/* ── VIEW: STATS ─────────────────────────────────────── */
function vStats(){
  const H=S.habits;
  if(!H.length)return`<div class="empty"><div class="ei">📊</div><h3>No data yet</h3><p>Add a habit and start tracking to see your progress here.</p></div>`;

  const today=new Date();
  let tot=0,poss=0;
  for(let i=0;i<30;i++){const d=iso(addDays(today,-i));tot+=H.filter(h=>done(h.id,d)).length;poss+=H.length}
  const cons=poss?Math.round(tot/poss*100):0;
  const best=H.length?Math.max(...H.map(h=>bestStreak(h))):0;
  const wk=H.reduce((a,h)=>a+weekCount(h.id),0);

  // Bar chart
  const bars=Array.from({length:7},(_,i)=>{
    const d=addDays(today,i-6),c=H.filter(h=>done(h.id,iso(d))).length;
    return{l:DAYS[(d.getDay()+6)%7],p:H.length?c/H.length:0,isToday:i===6};
  });
  const barHTML=bars.map(b=>`<div class="bar-col">
    <div class="bar-wrap"><div class="bar-fill${b.p>0?' hi':''}" style="height:${Math.max(4,Math.round(b.p*96))}px"></div></div>
    <div class="bar-day${b.isToday?' cur':''}">${b.l}</div>
  </div>`).join('');

  // Heatmap
  const start=addDays(monday(today),-77);
  let cells='';
  for(let w=0;w<12;w++)for(let d=0;d<7;d++){
    const dt=addDays(start,w*7+d);if(dt>today)continue;
    const p=H.length?H.filter(h=>done(h.id,iso(dt))).length/H.length:0;
    const op=p===0?0:(.2+p*.8);
    cells+=`<rect x="${w*22}" y="${d*22}" width="18" height="18" rx="4"
      fill="${p?'var(--accent)':'var(--surface2)'}" ${p?`fill-opacity="${op.toFixed(2)}"`:''}>
      <title>${iso(dt)}: ${H.filter(h=>done(h.id,iso(dt))).length}/${H.length}</title></rect>`;
  }

  // Habit bars
  const habitBars=H.map(h=>{
    const c=weekCount(h.id),p=Math.min(1,c/h.goal),s=streak(h.id),bs=bestStreak(h.id);
    return`<div class="hp-row">
      <div class="hp-top">
        <span class="hp-ico">${h.emoji}</span>
        <span class="hp-name">${esc(h.name)}</span>
        <span class="hp-cnt" style="color:${h.color}">${c}/${h.goal}</span>
      </div>
      <div class="hp-bar"><div class="hp-fill" style="width:${Math.round(p*100)}%;background:${h.color}"></div></div>
      <div class="hp-sub">🔥 ${s}-day streak &nbsp;·&nbsp; 🏆 best ${bs} days</div>
    </div>`;
  }).join('');

  const swatches=[0,.25,.5,.75,1].map(op=>`<span style="background:${op?'var(--accent)':'var(--surface2)'};opacity:${op?(.2+op*.8):1}"></span>`).join('');

  return`<div class="stat-grid">
    <div class="stat-card"><span class="stat-num">${wk}</span><span class="stat-lbl">Check-ins this week</span></div>
    <div class="stat-card"><span class="stat-num">${cons}%</span><span class="stat-lbl">30-day consistency</span></div>
    <div class="stat-card"><span class="stat-num">${best}</span><span class="stat-lbl">Best streak (days)</span></div>
  </div>
  <div class="card card-p">
    <div class="card-title">Last 7 Days</div>
    <div class="bar-chart">${barHTML}</div>
  </div>
  <div class="card card-p">
    <div class="card-title">Weekly Goals</div>
    <div class="hp-list">${habitBars}</div>
  </div>
  <div class="card card-p">
    <div class="card-title">12-Week Heatmap</div>
    <div class="hmap-wrap">
      <svg viewBox="0 0 262 152" width="100%" role="img" aria-label="Activity heatmap">${cells}</svg>
    </div>
    <div class="hmap-legend">
      <span>12 weeks ago</span>
      <div class="hmap-swatches">Less ${swatches} More</div>
    </div>
  </div>`;
}

/* ── VIEW: HABITS ────────────────────────────────────── */
function vHabits(){
  if(!S.habits.length)return`<div class="empty"><div class="ei">⚙️</div><h3>No habits yet</h3><p>Tap <strong>+</strong> to add your first habit.</p></div>`;
  const rows=S.habits.map(h=>`<div class="mg-row">
    <div class="hab-ico" style="background:${h.color}1a;border-radius:14px;width:44px;height:44px;font-size:22px;display:grid;place-items:center;flex-shrink:0">${h.emoji}</div>
    <div class="mg-info">
      <span class="mg-name">${esc(h.name)}</span>
      <span class="mg-goal">${h.goal} day${h.goal>1?'s':''} per week · 🔥 ${streak(h.id)}-day streak</span>
    </div>
    <button class="edit-btn" data-e="${h.id}">Edit</button>
  </div>`).join('');
  return`<div class="card">${rows}</div>`;
}

/* ── SHEET ───────────────────────────────────────────── */
function sheet(id){
  const h=S.habits.find(x=>x.id===id)||{name:'',emoji:EMOJI[0],color:COLORS[0],goal:5};
  let em=h.emoji,co=h.color;

  const ov=document.createElement('div');ov.className='sh-bg';
  ov.innerHTML=`<div class="sh" role="dialog" aria-modal="true">
    <div class="sh-handle"></div>
    <h3>${id?'Edit habit':'New habit'}</h3>
    <div class="fl">
      <label class="fl-lbl" for="sh-nm">Name</label>
      <input class="fl-inp" type="text" id="sh-nm" maxlength="40" autocomplete="off" value="${esc(h.name)}" placeholder="e.g. Meditate 10 minutes">
    </div>
    <div class="fl">
      <label class="fl-lbl">Icon</label>
      <div class="pick-grid" id="sh-em">${EMOJI.map(e=>`<button class="pick-opt${e===em?' on':''}" data-v="${e}">${e}</button>`).join('')}</div>
    </div>
    <div class="fl">
      <label class="fl-lbl">Colour</label>
      <div class="pick-grid" id="sh-co">${COLORS.map(c=>`<button class="col-opt${c===co?' on':''}" data-v="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div>
    </div>
    <div class="fl">
      <label class="fl-lbl">Weekly goal</label>
      <div class="goal-big" id="sh-gv">${h.goal}</div>
      <div class="goal-sub">days per week</div>
      <input type="range" id="sh-gl" min="1" max="7" value="${h.goal}" aria-label="Weekly goal">
    </div>
    <div class="btn-col">
      <button class="btn btn-p" id="sh-sv">${id?'Save changes':'Create habit'}</button>
      <button class="btn btn-s" id="sh-cn">Cancel</button>
      ${id?'<button class="btn btn-d" id="sh-dl">Delete habit</button>':''}
    </div>
  </div>`;

  $('#app').appendChild(ov);
  $('#fab').classList.add('open');
  requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add('vis')));

  const close=()=>{
    ov.classList.remove('vis');$('#fab').classList.remove('open');
    setTimeout(()=>ov.remove(),350);
  };
  ov.addEventListener('click',e=>{if(e.target===ov)close()});

  ov.querySelector('#sh-em').addEventListener('click',e=>{
    const b=e.target.closest('.pick-opt');if(!b)return;
    em=b.dataset.v;ov.querySelectorAll('#sh-em .pick-opt').forEach(x=>x.classList.toggle('on',x===b));
  });
  ov.querySelector('#sh-co').addEventListener('click',e=>{
    const b=e.target.closest('.col-opt');if(!b)return;
    co=b.dataset.v;ov.querySelectorAll('#sh-co .col-opt').forEach(x=>x.classList.toggle('on',x===b));
  });
  ov.querySelector('#sh-gl').oninput=e=>ov.querySelector('#sh-gv').textContent=e.target.value;
  ov.querySelector('#sh-cn').onclick=close;

  ov.querySelector('#sh-sv').onclick=async()=>{
    const name=ov.querySelector('#sh-nm').value.trim();
    if(!name){ov.querySelector('#sh-nm').focus();return}
    const goal=+ov.querySelector('#sh-gl').value;
    const btn=ov.querySelector('#sh-sv');
    btn.textContent='Saving…';btn.disabled=true;
    try{
      if(id){const u=await api('/api/habits/'+id,{method:'PUT',body:JSON.stringify({name,emoji:em,color:co,goal})});Object.assign(S.habits.find(x=>x.id===id),u);toast('✅ Habit updated!')}
      else{S.habits.push(await api('/api/habits',{method:'POST',body:JSON.stringify({name,emoji:em,color:co,goal})}));toast('🌱 Habit created!')}
      close();renderMain();
    }catch(err){
      toast('❌ Could not save. Try again.');
      btn.textContent=id?'Save changes':'Create habit';btn.disabled=false;
    }
  };

  const dl=ov.querySelector('#sh-dl');
  if(dl)dl.onclick=async()=>{
    if(!confirm('Delete this habit and all its history?'))return;
    dl.textContent='Deleting…';dl.disabled=true;
    try{await api('/api/habits/'+id,{method:'DELETE'});S.habits=S.habits.filter(x=>x.id!==id);toast('🗑️ Habit deleted.');close();renderMain()}
    catch(err){toast('❌ Could not delete.');dl.textContent='Delete habit';dl.disabled=false}
  };
}

/* ── SKELETON ────────────────────────────────────────── */
function skeleton(){
  $('#main').innerHTML=`
    <div style="height:120px;border-radius:var(--r-lg);margin-bottom:14px" class="skel"></div>
    <div class="card">
      ${Array.from({length:3},()=>`<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)">
        <div class="skel" style="width:44px;height:44px;border-radius:14px;flex-shrink:0"></div>
        <div style="flex:1"><div class="skel" style="height:13px;width:55%;margin-bottom:8px"></div><div class="skel" style="height:9px;width:38%"></div></div>
        <div class="skel" style="width:44px;height:44px;border-radius:50%"></div>
      </div>`).join('')}
    </div>`;
}

/* ── RENDER ──────────────────────────────────────────── */
function renderMain(){
  $('#main').innerHTML={today:vToday,stats:vStats,habits:vHabits}[view]();
  // Animate stat bars after paint
  if(view==='stats'){
    requestAnimationFrame(()=>{
      document.querySelectorAll('.hp-fill').forEach(el=>{const w=el.style.width;el.style.width='0';requestAnimationFrame(()=>el.style.width=w)});
    });
  }
}

function render(){
  const titles={today:greeting,stats:()=>'Progress',habits:()=>`Habits (${S.habits.length})`};
  const subs={
    today:()=>new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'}),
    stats:()=>'Your consistency at a glance',
    habits:()=>S.habits.length?'Tap a habit to edit':'Add your first habit below'
  };
  $('#hd-title').textContent=titles[view]();
  $('#hd-sub').textContent=subs[view]();
  renderMain();

  // Nav pill
  document.querySelectorAll('nav button').forEach((b,i)=>{
    b.classList.toggle('on',b.dataset.v===view);
    if(b.dataset.v===view){
      const nw=$('#nav').offsetWidth,pw=Math.round(nw/3-12);
      $('#pill').style.cssText=`left:${i*Math.round(nw/3)+6}px;width:${pw}px`;
    }
  });
  $('#fab').style.display=view==='stats'?'none':'grid';
}

/* ── EVENTS ──────────────────────────────────────────── */
$('#main').addEventListener('click',e=>{
  const t=e.target.closest('[data-t]'),x=e.target.closest('[data-e]');
  if(t)toggle(t.dataset.t);if(x)sheet(x.dataset.e);
});
$('#nav').addEventListener('click',e=>{
  const b=e.target.closest('button[data-v]');
  if(b){view=b.dataset.v;render();$('#main').scrollTop=0}
});
$('#fab').onclick=()=>sheet();

// Theme toggle
(()=>{
  const html=document.documentElement;
  const isDark=()=>html.dataset.theme==='dark'||((!html.dataset.theme||html.dataset.theme==='auto')&&matchMedia('(prefers-color-scheme:dark)').matches);
  $('#theme-btn').textContent=isDark()?'☀️':'🌙';
  $('#theme-btn').onclick=()=>{
    html.dataset.theme=isDark()?'light':'dark';
    $('#theme-btn').textContent=isDark()?'☀️':'🌙';
  };
})();

// URL shortcut deep-link
const urlV=new URLSearchParams(location.search).get('view');
if(['today','stats','habits'].includes(urlV))view=urlV;

/* ── SERVICE WORKER ──────────────────────────────────── */
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('/sw.js').then(async reg=>{
    if('Notification'in window&&Notification.permission==='default'){
      const p=await Notification.requestPermission();
      if(p==='granted'&&'periodicSync'in reg)
        try{await reg.periodicSync.register('daily-reminder',{minInterval:86400000})}catch(e){}
    }else if(Notification.permission==='granted'&&'periodicSync'in reg){
      try{await reg.periodicSync.register('daily-reminder',{minInterval:86400000})}catch(e){}
    }
  }).catch(()=>{});
}

/* ── BOOT ────────────────────────────────────────────── */
skeleton();
load().then(ok=>{if(ok)render()});
</script>
</body>
</html>
